<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Referral Letter Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        h1 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin: 8px 0;
            font-size: 13px;
            color: #555;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 6px 8px;
            margin-bottom: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 3px;
            font-size: 13px;
            box-sizing: border-box;
        }
        select {
            background-color: #f8f9fa;
            height: 30px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        #associatedSymptoms {
            height: 90px;
        }
        #output {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            margin-top: 15px;
            border-radius: 3px;
        }
        .clinical-details {
            margin: 10px 0;
        }
        .asterisk::after {
            content: '*';
            color: #e74c3c;
            margin-left: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Medical Referral Letter Generator</h1>

        <!-- Patient Information -->
        <label for="patientName" class="asterisk">Patient Name</label>
        <input type="text" id="patientName" placeholder="Enter patient name" required>

        <label for="age" class="asterisk">Age</label>
        <input type="number" id="age" placeholder="Enter patient age" required>

        <label for="gender" class="asterisk">Gender</label>
        <select id="gender" required>
            <option value="" disabled selected>Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label for="specialty" class="asterisk">Specialty</label>
        <select id="specialty" required>
            <option value="" disabled selected>Select specialty</option>
            <option value="Cardiology">Cardiology</option>
            <option value="Orthopedics">Orthopedics</option>
            <option value="Neurology">Neurology</option>
            <option value="Dermatology">Dermatology</option>
            <option value="Gastroenterology">Gastroenterology</option>
        </select>

        <label for="chiefComplaint" class="asterisk">Chief Complaint</label>
        <input type="text" id="chiefComplaint" placeholder="Enter chief complaint" required>

        <label for="additionalInfo">Additional Information</label>
        <textarea id="additionalInfo" placeholder="Enter any additional information"></textarea>

        <label for="painScore">Pain Score (0-10)</label>
        <input type="number" id="painScore" min="0" max="10" placeholder="Enter pain score">

        <label for="duration" class="asterisk">Duration of Symptoms</label>
        <select id="duration" required>
            <option value="" disabled selected>Select duration</option>
            <option value="Acute (<48 hours)">Acute (<48 hours)</option>
            <option value="Subacute (48 hours - 2 weeks)">Subacute (48 hours - 2 weeks)</option>
            <option value="Chronic (>2 weeks)">Chronic (>2 weeks)</option>
        </select>

        <label for="associatedSymptoms">Associated Symptoms</label>
        <textarea id="associatedSymptoms" placeholder="List associated symptoms (e.g., Nausea, Vomiting, Fever)"></textarea>

        <!-- Buttons -->
        <button onclick="generateLetter()">Generate Letter</button>
        <button onclick="resetForm()" style="background-color: #95a5a6">Reset</button>

        <!-- Output Section -->
        <div id="output"></div>
    </div>

    <script>
        function generateLetter() {
            // Collect input values
            const patientName = document.getElementById('patientName').value.trim();
            const age = document.getElementById('age').value.trim();
            const gender = document.getElementById('gender').value;
            const specialty = document.getElementById('specialty').value;
            const chiefComplaint = document.getElementById('chiefComplaint').value.trim();
            const additionalInfo = document.getElementById('additionalInfo').value.trim();
            const painScore = document.getElementById('painScore').value.trim();
            const duration = document.getElementById('duration').value;
            const associatedSymptoms = document.getElementById('associatedSymptoms').value.trim();

            // Validate required fields
            if (!patientName || !age || !gender || !specialty || !chiefComplaint || !duration) {
                alert("Please fill in all required fields.");
                return;
            }

            // Generate referral letter
            let letter = `Medical Referral Letter\n\n`;
            letter += `Patient Name: ${patientName}\n`;
            letter += `Age: ${age}\n`;
            letter += `Gender: ${gender}\n`;
            letter += `Specialty: ${specialty}\n`;
            letter += `Chief Complaint: ${chiefComplaint}\n`;
            if (additionalInfo) letter += `Additional Information: ${additionalInfo}\n`;
            if (painScore) letter += `Pain Score: ${painScore}/10\n`;
            letter += `Duration of Symptoms: ${duration}\n`;
            if (associatedSymptoms) letter += `Associated Symptoms: ${associatedSymptoms}\n`;

            // Display the referral letter
            document.getElementById('output').textContent = letter;
        }

        function resetForm() {
            // Reset all form fields
            document.getElementById('patientName').value = '';
            document.getElementById('age').value = '';
            document.getElementById('gender').value = '';
            document.getElementById('specialty').value = '';
            document.getElementById('chiefComplaint').value = '';
            document.getElementById('additionalInfo').value = '';
            document.getElementById('painScore').value = '';
            document.getElementById('duration').value = '';
            document.getElementById('associatedSymptoms').value = '';
            document.getElementById('output').textContent = '';
        }
    </script>
</body>
</html>
